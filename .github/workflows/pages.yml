name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Configure Vite base path
        run: |
          if [[ "${GITHUB_REPOSITORY##*/}" == *.github.io ]]; then
            echo "VITE_GITHUB_PAGES_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_GITHUB_PAGES_BASE=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          VITE_ATLAS_API_BASE: ${{ vars.ATLAS_API_BASE || 'https://ai-atlas.hansol.net/api/v1/public' }}
          VITE_ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          VITE_ATLAS_AGENT_ID: ${{ vars.ATLAS_AGENT_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
